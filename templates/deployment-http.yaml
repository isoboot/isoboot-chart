apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isoboot.fullname" . }}-http
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
    app.kubernetes.io/component: http
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isoboot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: http
  template:
    metadata:
      labels:
        {{- include "isoboot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: http
    spec:
      containers:
        - name: http
          image: "golang:1.25-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CONTROLLER_ADDR="{{ include "isoboot.fullname" . }}-controller.{{ .Release.Namespace }}.svc.cluster.local:8081"

              echo "Installing git..."
              apk add --no-cache git

              echo "Installing isoboot-http..."
              GOPROXY=direct go install github.com/isoboot/isoboot/cmd/isoboot-http@{{ .Values.commit }}

              echo "Starting isoboot-http on :{{ .Values.http.listenPort }}..."
              echo "Connecting to controller at ${CONTROLLER_ADDR}..."
              exec isoboot-http \
                --host="${HOST_IP}" \
                --port="{{ .Values.http.listenPort }}" \
                --proxy-port="{{ .Values.proxy.port }}" \
                --controller="${CONTROLLER_ADDR}" \
                --templates-configmap="{{ include "isoboot.fullname" . }}-templates"
          env:
            - name: GOCACHE
              value: /go/cache
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: http
              containerPort: {{ .Values.http.listenPort }}
              protocol: TCP
          volumeMounts:
            - name: go-cache
              mountPath: /go
          resources:
            {{- toYaml .Values.http.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.http.listenPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.http.listenPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: go-cache
          hostPath:
            path: /var/cache/isoboot/go/http
            type: DirectoryOrCreate
