apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isoboot.fullname" . }}-http
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
    app.kubernetes.io/component: http
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isoboot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: http
  template:
    metadata:
      labels:
        {{- include "isoboot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: http
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: http
          image: "{{ .Values.go.image }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              INTERFACE="{{ required "interface is required" .Values.interface }}"
              CONTROLLER_ADDR="{{ include "isoboot.fullname" . }}-controller.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.controller.port }}"

              echo "Installing dependencies..."
              apk add --no-cache git iproute2

              echo "Detecting host IP from interface ${INTERFACE}..."
              HOST_IP=$(ip -4 addr show "${INTERFACE}" | awk '/inet / {print $2}' | cut -d/ -f1 | head -1)
              if [ -z "$HOST_IP" ]; then
                echo "ERROR: Could not detect IP from interface ${INTERFACE}"
                exit 1
              fi
              echo "Host IP: ${HOST_IP}"

              echo "Installing isoboot-http..."
              GOPROXY=direct go install github.com/isoboot/isoboot/cmd/isoboot-http@{{ .Values.commit }}

              echo "Starting isoboot-http on :{{ .Values.http.listenPort }}..."
              echo "Connecting to controller at ${CONTROLLER_ADDR}..."
              exec isoboot-http \
                --host="${HOST_IP}" \
                --port="{{ .Values.http.listenPort }}" \
                --proxy-port="{{ .Values.proxy.port }}" \
                --controller="${CONTROLLER_ADDR}" \
                --templates-configmap="{{ include "isoboot.fullname" . }}-templates"
          env:
            - name: GOCACHE
              value: /go/cache
          ports:
            - name: http
              containerPort: {{ .Values.http.listenPort }}
              protocol: TCP
          volumeMounts:
            - name: go-cache
              mountPath: /go
          resources:
            {{- toYaml .Values.http.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.http.listenPort }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.http.listenPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.http.listenPort }}
            failureThreshold: 30
            periodSeconds: 10
      volumes:
        - name: go-cache
          hostPath:
            path: /var/cache/isoboot/go/http
            type: DirectoryOrCreate
