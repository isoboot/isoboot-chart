apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "isoboot.fullname" . }}-dhcp
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "isoboot.name" . }}-dhcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "isoboot.name" . }}-dhcp
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: dhcp-daemon
          image: alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CNI_VERSION="v1.4.0"
              ARCH="amd64"

              if [ ! -f /host/opt/cni/bin/dhcp ]; then
                echo "Downloading CNI DHCP plugin..."
                apk add --no-cache wget
                wget -q https://github.com/containernetworking/plugins/releases/download/${CNI_VERSION}/cni-plugins-linux-${ARCH}-${CNI_VERSION}.tgz -O /tmp/cni.tgz
                tar -xzf /tmp/cni.tgz -C /host/opt/cni/bin/ ./dhcp
                chmod +x /host/opt/cni/bin/dhcp
                rm /tmp/cni.tgz
                echo "DHCP plugin installed."
              else
                echo "DHCP plugin already exists."
              fi

              echo "Starting DHCP daemon..."
              exec /host/opt/cni/bin/dhcp daemon
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host/opt/cni/bin
            - name: run
              mountPath: /run
      volumes:
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: /run
            type: Directory
