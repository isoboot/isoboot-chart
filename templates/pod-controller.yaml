apiVersion: v1
kind: Pod
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  restartPolicy: Always
  serviceAccountName: {{ include "isoboot.fullname" . }}-controller
  containers:
    - name: controller
      image: "golang:1.25-alpine"
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          set -e

          echo "Installing git..."
          apk add --no-cache git

          echo "Installing isoboot-controller..."
          GOPROXY=direct go install github.com/isoboot/isoboot/cmd/isoboot-controller@{{ .Values.controller.commit }}

          echo "Starting isoboot-controller on :8081..."
          exec isoboot-controller \
            --port="8081" \
            --namespace="{{ .Release.Namespace }}"
      env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      ports:
        - name: grpc
          containerPort: 8081
          protocol: TCP
      resources:
        {{- toYaml .Values.controller.resources | nindent 8 }}
      livenessProbe:
        tcpSocket:
          port: 8081
        initialDelaySeconds: 120
        periodSeconds: 30
      readinessProbe:
        tcpSocket:
          port: 8081
        initialDelaySeconds: 60
        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "isoboot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      protocol: TCP
