apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["isoboot.io"]
    resources: ["machines", "provisions", "boottargets", "responsetemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["isoboot.io"]
    resources: ["provisions/status", "boottargets/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "isoboot.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "isoboot.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
