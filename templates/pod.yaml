apiVersion: v1
kind: Pod
metadata:
  name: {{ include "isoboot.fullname" . }}
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
  annotations:
    k8s.v1.cni.cncf.io/networks: {{ include "isoboot.fullname" . }}-macvlan
spec:
  restartPolicy: Always
  containers:
    - name: pxe-server
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Installing dnsmasq..."
          apk add --no-cache dnsmasq

          echo "Setting up TFTP directory..."
          mkdir -p /tftpboot

          echo "Downloading iPXE binaries..."
          wget -O /tftpboot/undionly.kpxe https://boot.ipxe.org/undionly.kpxe
          wget -O /tftpboot/ipxe.efi https://boot.ipxe.org/ipxe.efi

          echo "iPXE files:"
          ls -la /tftpboot/

          echo "Starting dnsmasq on interface net1..."
          exec dnsmasq -k -C /etc/dnsmasq.conf --log-facility=-
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      livenessProbe:
        exec:
          command:
            - pidof
            - dnsmasq
        initialDelaySeconds: 30
        periodSeconds: 30
      readinessProbe:
        exec:
          command:
            - pidof
            - dnsmasq
        initialDelaySeconds: 10
        periodSeconds: 10
      volumeMounts:
        - name: config
          mountPath: /etc/dnsmasq.conf
          subPath: dnsmasq.conf
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: {{ include "isoboot.fullname" . }}-config
