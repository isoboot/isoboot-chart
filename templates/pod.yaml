apiVersion: v1
kind: Pod
metadata:
  name: {{ include "isoboot.fullname" . }}
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
spec:
  restartPolicy: Always
  hostNetwork: true
  containers:
    - name: pxe-server
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/sh
        - -c
        - |
          set -e
          INTERFACE="{{ required "interface is required (e.g., --set interface=br1)" .Values.interface }}"

          echo "Installing dnsmasq and iproute2..."
          apk add --no-cache dnsmasq iproute2

          echo "Detecting subnet from interface $INTERFACE..."
          SUBNET=$(ip -4 addr show "$INTERFACE" | awk '/inet / {split($2, a, "/"); split(a[1], b, "."); print b[1]"."b[2]"."b[3]".0"}' | head -1)
          echo "Detected subnet: $SUBNET"

          echo "Setting up TFTP directory..."
          mkdir -p /tftpboot

          echo "Downloading iPXE binaries..."
          wget -O /tftpboot/undionly.kpxe https://boot.ipxe.org/undionly.kpxe
          wget -O /tftpboot/ipxe.efi https://boot.ipxe.org/ipxe.efi

          echo "iPXE files:"
          ls -la /tftpboot/

          echo "Generating dnsmasq config..."
          cat > /tmp/dnsmasq.conf << 'DNSMASQ_EOF'
          port=0
          interface=$INTERFACE
          dhcp-range=$SUBNET,proxy
          enable-tftp
          tftp-root=/tftpboot
          log-dhcp
          dhcp-boot=undionly.kpxe
          dhcp-match=set:efi-x86_64,option:client-arch,7
          dhcp-match=set:efi-x86_64,option:client-arch,9
          dhcp-boot=tag:efi-x86_64,ipxe.efi
          pxe-service=x86PC,"PXE Boot",undionly.kpxe
          pxe-service=X86-64_EFI,"PXE Boot UEFI",ipxe.efi
          DNSMASQ_EOF
          sed -i 's/^          //' /tmp/dnsmasq.conf
          sed -i "s/\$INTERFACE/$INTERFACE/g; s/\$SUBNET/$SUBNET/g" /tmp/dnsmasq.conf

          echo "Starting dnsmasq on interface $INTERFACE (subnet $SUBNET)..."
          exec dnsmasq -k -C /tmp/dnsmasq.conf --log-facility=-
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      livenessProbe:
        exec:
          command:
            - pidof
            - dnsmasq
        initialDelaySeconds: 30
        periodSeconds: 30
      readinessProbe:
        exec:
          command:
            - pidof
            - dnsmasq
        initialDelaySeconds: 10
        periodSeconds: 10
