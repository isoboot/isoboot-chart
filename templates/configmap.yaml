apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "isoboot.fullname" . }}-config
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
data:
  dnsmasq.conf: |
    # Disable DNS
    port=0

    # Bind to macvlan interface (net1 inside pod)
    interface=net1
    bind-interfaces

    # Proxy DHCP mode - don't act as DHCP server, just add PXE options
    dhcp-range=0.0.0.0,proxy

    # Enable built-in TFTP server
    enable-tftp
    tftp-root=/tftpboot

    # Log DHCP/TFTP activity
    log-dhcp

    # PXE boot options
    # Legacy BIOS
    dhcp-boot=undionly.kpxe
    # UEFI detection and boot file
    dhcp-match=set:efi-x86_64,option:client-arch,7
    dhcp-match=set:efi-x86_64,option:client-arch,9
    dhcp-boot=tag:efi-x86_64,ipxe.efi

    # PXE service types
    pxe-service=x86PC,"PXE Boot",undionly.kpxe
    pxe-service=X86-64_EFI,"PXE Boot UEFI",ipxe.efi
