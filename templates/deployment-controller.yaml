apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isoboot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "isoboot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "isoboot.fullname" . }}-controller
      containers:
        - name: controller
          image: "golang:1.25-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              PROXY_URL="http://{{ include "isoboot.fullname" . }}-squid.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.proxy.port }}"

              echo "Installing dependencies..."
              apk add --no-cache git netcat-openbsd

              echo "Waiting for squid proxy..."
              SQUID_HOST="{{ include "isoboot.fullname" . }}-squid.{{ .Release.Namespace }}.svc.cluster.local"
              for i in $(seq 1 30); do
                if nc -z "$SQUID_HOST" {{ .Values.proxy.port }} 2>/dev/null; then
                  echo "Squid is ready"
                  break
                fi
                echo "Waiting for squid ($i/30)..."
                sleep 2
              done

              echo "Installing isoboot-controller..."
              HTTP_PROXY="$PROXY_URL" HTTPS_PROXY="$PROXY_URL" GOPROXY=direct \
                go install github.com/isoboot/isoboot/cmd/isoboot-controller@{{ .Values.controller.commit }}

              echo "Starting isoboot-controller on :8081..."
              exec isoboot-controller \
                --port="8081" \
                --namespace="{{ .Release.Namespace }}"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "isoboot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      protocol: TCP
