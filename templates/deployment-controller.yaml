apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isoboot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "isoboot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "isoboot.fullname" . }}-controller
      containers:
        - name: controller
          image: "{{ .Values.go.image }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Installing git..."
              apk add --no-cache git

              echo "Installing isoboot-controller..."
              GOPROXY=direct go install github.com/isoboot/isoboot/cmd/isoboot-controller@{{ .Values.commit }}

              echo "Starting isoboot-controller on :{{ .Values.controller.port }}..."
              exec isoboot-controller \
                --port="{{ .Values.controller.port }}" \
                --namespace="{{ .Release.Namespace }}" \
                --files-path="/opt/isoboot/files"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOCACHE
              value: /go/cache
          ports:
            - name: grpc
              containerPort: {{ .Values.controller.port }}
              protocol: TCP
          volumeMounts:
            - name: go-cache
              mountPath: /go
            - name: files-storage
              mountPath: /opt/isoboot/files
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.controller.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: {{ .Values.controller.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: {{ .Values.controller.port }}
            failureThreshold: 30
            periodSeconds: 10
      volumes:
        - name: go-cache
          hostPath:
            path: /var/cache/isoboot/go/controller
            type: DirectoryOrCreate
        - name: files-storage
          hostPath:
            path: /opt/isoboot/files
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "isoboot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: grpc
      port: {{ .Values.controller.port }}
      targetPort: {{ .Values.controller.port }}
      protocol: TCP
