apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "isoboot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "isoboot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "isoboot.fullname" . }}-controller
      containers:
        - name: controller
          image: "golang:1.25-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Installing git..."
              apk add --no-cache git

              echo "Installing isoboot-controller..."
              GOPROXY=direct go install github.com/isoboot/isoboot/cmd/isoboot-controller@{{ .Values.controller.commit }}

              HTTP_PORT="{{ .Values.http.port }}"

              if [ -z "${HOST_IP:-}" ]; then
                echo "Error: HOST_IP environment variable is not set or empty." >&2
                exit 1
              fi

              echo "Using host IP: ${HOST_IP}"

              echo "Starting isoboot-controller on :8081..."
              exec isoboot-controller \
                --port="8081" \
                --namespace="{{ .Release.Namespace }}" \
                --iso-path="/opt/isoboot/iso" \
                --http-host="${HOST_IP}" \
                --http-port="${HTTP_PORT}"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: GOCACHE
              value: /go/cache
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: go-cache
              mountPath: /go
            - name: iso-storage
              mountPath: /opt/isoboot/iso
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: go-cache
          hostPath:
            path: /var/cache/isoboot/go/controller
            type: DirectoryOrCreate
        - name: iso-storage
          hostPath:
            path: /opt/isoboot/iso
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "isoboot.fullname" . }}-controller
  labels:
    {{- include "isoboot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "isoboot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      protocol: TCP
