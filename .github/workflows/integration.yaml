name: Integration Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster
          kubectl cluster-info

      - name: Detect network interface
        run: |
          INTERFACE=$(docker exec kind-control-plane \
            ip -4 route list default | awk '{print $5}')
          INTERFACE=${INTERFACE:-eth0}
          echo "INTERFACE=$INTERFACE" >> $GITHUB_ENV
          echo "Detected interface: $INTERFACE"

      - name: Install CRDs
        run: kubectl apply -f ./crds/

      - name: Helm install (squid only)
        run: |
          helm install isoboot . -n isoboot --create-namespace \
            --set interface=${{ env.INTERFACE }} \
            --set proxy.resources.limits.memory=2Gi

      - name: Wait for squid pod
        run: |
          kubectl wait --for=condition=ready pod \
            -l 'app.kubernetes.io/component=proxy' \
            -n isoboot --timeout=120s

      - name: Show pod status
        if: always()
        run: |
          kubectl get pods -n isoboot -o wide

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Squid Pod Describe ==="
          kubectl describe pod -l 'app.kubernetes.io/component=proxy' \
            -n isoboot || true
          echo ""
          echo "=== Squid Cache Log ==="
          SQUID_POD=$(kubectl get pod -l 'app.kubernetes.io/component=proxy' \
            -n isoboot -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$SQUID_POD" -n isoboot -- cat /var/log/squid/cache.log 2>/dev/null || true
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n isoboot -o name); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n isoboot --all-containers=true --tail=100 || true
          done
