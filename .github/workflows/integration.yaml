name: Integration Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster
          kubectl cluster-info

      - name: Detect network interface
        run: |
          INTERFACE=$(docker exec kind-control-plane \
            ip -4 route list default | awk '{print $5}')
          INTERFACE=${INTERFACE:-eth0}
          echo "INTERFACE=$INTERFACE" >> $GITHUB_ENV
          echo "Detected interface: $INTERFACE"

      - name: Install CRDs
        run: kubectl apply -f ./crds/

      - name: Helm install (squid only)
        run: |
          helm install isoboot . -n isoboot --create-namespace \
            --set interface=${{ env.INTERFACE }} \
            --set proxy.cacheSize=100

      - name: Check cgroup memory limits
        run: |
          echo "=== Kind container memory limit ==="
          docker inspect kind-control-plane --format '{{.HostConfig.Memory}}' || true
          echo ""
          echo "=== Cgroup v2 memory.max (inside kind node) ==="
          docker exec kind-control-plane cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          echo ""
          echo "=== Cgroup v2 memory.current ==="
          docker exec kind-control-plane cat /sys/fs/cgroup/memory.current 2>/dev/null || true
          echo ""
          echo "=== Node memory ==="
          docker exec kind-control-plane free -m

      - name: Scale down non-squid pods
        run: |
          kubectl scale deployment isoboot-controller isoboot-http isoboot-nginx \
            -n isoboot --replicas=0
          kubectl delete pod isoboot-dnsmasq -n isoboot --ignore-not-found

      - name: Wait for squid rollout
        run: |
          kubectl rollout status deployment/isoboot-squid -n isoboot --timeout=120s

      - name: Wait for squid pod
        run: |
          kubectl wait --for=condition=ready pod \
            -l 'app.kubernetes.io/component=proxy' \
            -n isoboot --timeout=120s

      - name: Show pod status
        if: always()
        run: |
          kubectl get pods -n isoboot -o wide

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Kernel OOM messages ==="
          docker exec kind-control-plane dmesg | grep -i -E "(oom|killed|out of memory)" | tail -20 || true
          echo ""
          echo "=== /dev/shm usage ==="
          docker exec kind-control-plane df -h /dev/shm || true
          echo ""
          echo "=== Squid Pod Describe ==="
          kubectl describe pod -l 'app.kubernetes.io/component=proxy' \
            -n isoboot || true
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n isoboot -o name); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n isoboot --all-containers=true --tail=100 || true
          done
