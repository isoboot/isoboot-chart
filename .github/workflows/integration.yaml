name: Integration Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only -R ${{ github.repository }})
          if [ -z "$FILES" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "No files changed — running tests as safety measure"
            exit 0
          fi
          NON_DOCS=$(echo "$FILES" | grep -v '\.md$' || true)
          if [ -z "$NON_DOCS" ]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "All changed files are .md — skipping integration test"
          else
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  integration:
    needs: check-changes
    if: needs.check-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster
          kubectl cluster-info

      - name: Extract commit
        run: |
          COMMIT=$(grep '^commit:' values.yaml | awk '{print $2}' | tr -d '"')
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "Commit: $COMMIT"

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/isoboot-cache
          key: isoboot-cache-v6-${{ env.COMMIT }}
          restore-keys: |
            isoboot-cache-v6-

      - name: Load cache into kind node
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: |
          docker exec kind-control-plane mkdir -p /var/cache/isoboot/go
          cd /tmp/isoboot-cache && tar cf - . \
            | docker exec -i kind-control-plane tar xf - -C /var/cache/isoboot/go

      - name: Detect network interface
        run: |
          INTERFACE=$(docker exec kind-control-plane \
            ip -4 route list default | awk '{print $5}')
          INTERFACE=${INTERFACE:-eth0}
          echo "INTERFACE=$INTERFACE" >> $GITHUB_ENV
          echo "Detected interface: $INTERFACE"

      - name: Install CRDs
        run: kubectl apply -f ./crds/

      - name: Helm install
        run: |
          helm install isoboot . -n isoboot --create-namespace \
            --set interface=${{ env.INTERFACE }}

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod --all \
            -n isoboot --timeout=900s

      - name: Apply test fixtures
        run: |
          kubectl apply -f ./tests/integration/iso-compare/fixtures.yaml
          kubectl apply -f ./tests/integration/boot/fixtures.yaml
          kubectl apply -f ./tests/integration/e2e/fixtures.yaml

      - name: Wait for BootSource
        run: |
          kubectl wait --for=jsonpath='{.status.phase}'=Complete \
            bootsource/debian-12 \
            bootsource/debian-13 \
            bootsource/debian-13-iso \
            -n isoboot --timeout=600s

      - name: Get host IP
        run: |
          HOST_IP=$(docker exec kind-control-plane \
            ip -4 addr show "${{ env.INTERFACE }}" \
            | awk '/inet / {print $2}' | cut -d/ -f1 | head -1)
          if [ -z "$HOST_IP" ]; then
            echo "Error: Failed to determine HOST_IP for interface '${{ env.INTERFACE }}'."
            exit 1
          fi
          echo "HOST_IP=$HOST_IP" >> $GITHUB_ENV
          echo "Host IP: $HOST_IP"

      - name: Test static content serving
        run: ./tests/integration/iso-content/run.sh "$HOST_IP"

      - name: Test ISO extraction matches direct download
        run: ./tests/integration/iso-compare/test.sh "$HOST_IP"

      - name: Test boot endpoints
        run: ./tests/integration/boot/test.sh "$HOST_IP"

      - name: Test e2e provisioning flow
        run: ./tests/integration/e2e/test.sh "$HOST_IP"

      - name: Show pod status
        if: always()
        run: |
          kubectl get pods -n isoboot -o wide

      - name: Save cache from kind node
        if: always()
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^kind-control-plane$'; then
            echo "kind-control-plane container not found, skipping cache save"
            exit 0
          fi
          if docker exec kind-control-plane test -d /var/cache/isoboot/go; then
            sudo rm -rf /tmp/isoboot-cache
            mkdir -p /tmp/isoboot-cache
            docker exec kind-control-plane tar cf - -C /var/cache/isoboot/go . \
              | tar xf - -C /tmp/isoboot-cache
          else
            echo "/var/cache/isoboot/go does not exist in kind node, skipping"
          fi

      - name: Save cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/isoboot-cache
          key: isoboot-cache-v6-${{ env.COMMIT }}

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== CRD Status ==="
          kubectl get bootsource,provision,machine,boottarget,responsetemplate \
            -n isoboot -o wide 2>/dev/null || true
          echo ""
          echo "=== Files storage ==="
          docker exec kind-control-plane \
            find /opt/isoboot/files -type f -ls 2>/dev/null || true
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n isoboot -o name); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n isoboot --all-containers=true --tail=100 || true
          done
