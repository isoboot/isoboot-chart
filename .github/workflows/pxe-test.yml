name: PXE Install Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only -R ${{ github.repository }})
          if [ -z "$FILES" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "No files changed — running tests as safety measure"
            exit 0
          fi
          NON_DOCS=$(echo "$FILES" | grep -v '\.md$' || true)
          if [ -z "$NON_DOCS" ]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "All changed files are .md — skipping tests"
          else
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  pxe-test:
    needs: check-changes
    if: needs.check-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            version: "12"
            codename: bookworm
            boot_target: debian-12-no-firmware
          - distro: debian
            version: "13"
            codename: trixie
            boot_target: debian-13-no-firmware
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check KVM
        id: kvm
        run: |
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM not available, skipping PXE install test"
          fi

      - name: Install dependencies
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf dnsmasq-base \
            bridge-utils iproute2 openssh-client sshpass dbus

      - name: Install kind
        if: steps.kvm.outputs.available == 'true'
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install helm
        if: steps.kvm.outputs.available == 'true'
        uses: azure/setup-helm@v4

      - name: Extract commit
        if: steps.kvm.outputs.available == 'true'
        run: |
          COMMIT=$(grep '^commit:' values.yaml | awk '{print $2}' | tr -d '"')
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"
          echo "Commit: $COMMIT"

      - name: Restore cache
        if: steps.kvm.outputs.available == 'true'
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /tmp/isoboot-cache
          key: isoboot-cache-v6-${{ env.COMMIT }}
          restore-keys: |
            isoboot-cache-v6-

      - name: Setup cluster
        if: steps.kvm.outputs.available == 'true'
        run: sudo tests/integration/pxe-install/setup.sh

      - name: Run PXE install test
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo tests/integration/pxe-install/run.sh \
            ${{ matrix.distro }} ${{ matrix.version }} ${{ matrix.codename }} ${{ matrix.boot_target }}

      - name: Collect debug logs
        if: failure()
        run: |
          sudo mkdir -p /tmp/pxe-install-test/artifacts
          sudo cp /tmp/pxe-install-test/dnsmasq.log /tmp/pxe-install-test/artifacts/ 2>/dev/null || true
          sudo cp /tmp/pxe-install-test/*/serial.log /tmp/pxe-install-test/artifacts/ 2>/dev/null || true
          sudo cp /tmp/pxe-install-test/*/rendered-preseed.cfg /tmp/pxe-install-test/artifacts/ 2>/dev/null || true
          {
            echo "=== CRD Status ==="
            kubectl get bootsource,provision,machine,boottarget,responsetemplate \
              -n isoboot -o wide 2>/dev/null || true
            echo ""
            echo "=== Pod Status ==="
            kubectl get pods -n isoboot -o wide 2>/dev/null || true
            echo ""
            echo "=== Pod Logs ==="
            for pod in $(kubectl get pods -n isoboot -o name 2>/dev/null); do
              echo "--- $pod ---"
              kubectl logs "$pod" -n isoboot --all-containers=true --tail=100 || true
            done
          } | sudo tee /tmp/pxe-install-test/artifacts/kubernetes.log > /dev/null 2>&1
          sudo chmod -R a+r /tmp/pxe-install-test/artifacts/

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pxe-test-logs-${{ matrix.distro }}-${{ matrix.version }}
          path: /tmp/pxe-install-test/artifacts/
          retention-days: 14

      - name: Teardown
        if: always() && steps.kvm.outputs.available == 'true'
        run: sudo tests/integration/pxe-install/teardown.sh

      - name: Save cache from kind node
        if: always() && steps.kvm.outputs.available == 'true'
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^kind-control-plane$'; then
            echo "kind-control-plane container not found, skipping cache save"
            exit 0
          fi
          if docker exec kind-control-plane test -d /var/cache/isoboot/go; then
            sudo rm -rf /tmp/isoboot-cache
            mkdir -p /tmp/isoboot-cache
            docker exec kind-control-plane tar cf - -C /var/cache/isoboot/go . \
              | tar xf - -C /tmp/isoboot-cache
          else
            echo "/var/cache/isoboot/go does not exist in kind node, skipping"
          fi

      - name: Save cache
        if: always() && steps.kvm.outputs.available == 'true' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/isoboot-cache
          key: isoboot-cache-v6-${{ env.COMMIT }}
