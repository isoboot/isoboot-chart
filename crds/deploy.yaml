apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: deploys.isoboot.io
spec:
  group: isoboot.io
  names:
    kind: Deploy
    listKind: DeployList
    plural: deploys
    singular: deploy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - machineRef
                - bootTargetRef
                - responseTemplateRef
              properties:
                machineRef:
                  type: string
                  description: Reference to a Machine resource name
                bootTargetRef:
                  type: string
                  description: Reference to a BootTarget resource name
                responseTemplateRef:
                  type: string
                  minLength: 1
                  description: Reference to a ResponseTemplate resource name
                configMaps:
                  type: array
                  description: Array of ConfigMap names for template values (merged in order)
                  items:
                    type: string
                    minLength: 1
                secrets:
                  type: array
                  description: Array of Secret names for template values (merged after configMaps)
                  items:
                    type: string
                    minLength: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - WaitingForDiskImage
                    - InProgress
                    - Complete
                    - Failed
                    - ConfigError
                  default: Pending
                message:
                  type: string
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Machine
          type: string
          jsonPath: .spec.machineRef
        - name: BootTarget
          type: string
          jsonPath: .spec.bootTargetRef
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
