apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bootsources.isoboot.io
spec:
  group: isoboot.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "(has(self.kernel) && has(self.initrd)) || has(self.iso)"
                  message: "must specify either (kernel + initrd) or iso"
                - rule: "!((has(self.kernel) || has(self.initrd)) && has(self.iso))"
                  message: "cannot specify both (kernel/initrd) and iso"
              properties:
                kernel:
                  type: object
                  description: Kernel file to download directly
                  required:
                    - url
                  properties:
                    url:
                      type: string
                      minLength: 1
                      description: URL to download the kernel from
                    checksumURL:
                      type: string
                      description: URL to a checksums file (SHA256SUMS format) for verification
                initrd:
                  type: object
                  description: Initrd file to download directly
                  required:
                    - url
                  properties:
                    url:
                      type: string
                      minLength: 1
                      description: URL to download the initrd from
                    checksumURL:
                      type: string
                      description: URL to a checksums file (SHA256SUMS format) for verification
                iso:
                  type: object
                  description: ISO image to download and extract kernel/initrd from
                  required:
                    - url
                    - kernel
                    - initrd
                  properties:
                    url:
                      type: string
                      minLength: 1
                      description: URL to download the ISO from
                    checksumURL:
                      type: string
                      description: URL to a checksums file (SHA256SUMS format) for verification
                    kernel:
                      type: string
                      minLength: 1
                      description: Path to the kernel within the ISO
                    initrd:
                      type: string
                      minLength: 1
                      description: Path to the initrd within the ISO
                firmware:
                  type: object
                  description: Firmware archive for initrd concatenation (optional)
                  required:
                    - url
                  properties:
                    url:
                      type: string
                      minLength: 1
                      description: URL to download the firmware from
                    checksumURL:
                      type: string
                      description: URL to a checksums file (SHA256SUMS format) for verification
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Downloading
                    - Complete
                    - Failed
                  default: Pending
                message:
                  type: string
                  description: Human-readable status message
                kernel:
                  type: object
                  properties:
                    phase:
                      type: string
                    sha256:
                      type: string
                initrd:
                  type: object
                  properties:
                    phase:
                      type: string
                    sha256:
                      type: string
                iso:
                  type: object
                  properties:
                    phase:
                      type: string
                    sha256:
                      type: string
                firmware:
                  type: object
                  properties:
                    phase:
                      type: string
                    sha256:
                      type: string
                firmwareInitrd:
                  type: object
                  properties:
                    phase:
                      type: string
                    sha256:
                      type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Message
          type: string
          jsonPath: .status.message
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: bootsources
    singular: bootsource
    kind: BootSource
    shortNames:
      - bm
