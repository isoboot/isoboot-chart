apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: diskimages.isoboot.io
spec:
  group: isoboot.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - iso
              properties:
                iso:
                  type: string
                  description: URL to the ISO image
                firmware:
                  type: string
                  description: URL to firmware archive (optional)
      additionalPrinterColumns:
        - name: ISO
          type: string
          jsonPath: .spec.iso
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: diskimages
    singular: diskimage
    kind: DiskImage
    shortNames:
      - di
