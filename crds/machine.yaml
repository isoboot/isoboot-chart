apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machines.isoboot.io
spec:
  group: isoboot.io
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
    shortNames:
      - mach
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - macAddresses
              properties:
                macAddresses:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: "^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$"
                  description: List of MAC addresses for this machine
      additionalPrinterColumns:
        - name: MACs
          type: string
          jsonPath: .spec.macAddresses[0]
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
