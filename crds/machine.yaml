apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machines.isoboot.io
spec:
  group: isoboot.io
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
    shortNames:
      - mach
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - mac
              properties:
                mac:
                  type: string
                  pattern: "^([0-9A-Fa-f]{2}-){5}([0-9A-Fa-f]{2})$"
                  description: MAC address for this machine (dash-separated, e.g., aa-bb-cc-dd-ee-ff)
      additionalPrinterColumns:
        - name: MAC
          type: string
          jsonPath: .spec.mac
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
