apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: responsetemplates.isoboot.io
spec:
  group: isoboot.io
  names:
    kind: ResponseTemplate
    listKind: ResponseTemplateList
    plural: responsetemplates
    singular: responsetemplate
    shortNames:
      - rt
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - files
              properties:
                files:
                  type: object
                  description: Map of filename to template content with Go template placeholders
                  additionalProperties:
                    type: string
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
