apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: boottargets.isoboot.io
spec:
  group: isoboot.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - files
                - template
              properties:
                files:
                  type: array
                  minItems: 1
                  description: Files to download (kernel, initrd, firmware, etc.)
                  items:
                    type: object
                    required:
                      - url
                    properties:
                      url:
                        type: string
                        minLength: 1
                        description: URL to download the file from
                      checksumURL:
                        type: string
                        description: URL to a checksums file (SHA256SUMS format) for verification
                combinedFiles:
                  type: array
                  description: Files built by concatenating downloaded files (e.g., initrd + firmware)
                  items:
                    type: object
                    required:
                      - name
                      - sources
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: Output filename
                      sources:
                        type: array
                        minItems: 2
                        description: Filenames of downloaded files to concatenate (in order)
                        items:
                          type: string
                          minLength: 1
                template:
                  type: string
                  minLength: 1
                  description: iPXE boot template content
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Downloading
                    - Complete
                    - Failed
                  default: Pending
                message:
                  type: string
                  description: Human-readable status message
                files:
                  type: array
                  description: Download status per file
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                        enum:
                          - Pending
                          - Downloading
                          - Complete
                          - Failed
                      sha256:
                        type: string
                combinedFiles:
                  type: array
                  description: Build status per combined file
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                        enum:
                          - Pending
                          - Downloading
                          - Complete
                          - Failed
                      sha256:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Files
          type: integer
          jsonPath: .spec.files
          description: Number of files to download
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: boottargets
    singular: boottarget
    kind: BootTarget
    shortNames:
      - bt
