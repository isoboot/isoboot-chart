apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: boottargets.isoboot.io
spec:
  group: isoboot.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - bootSourceRef
                - template
              properties:
                bootSourceRef:
                  type: string
                  minLength: 1
                  description: Reference to a BootSource resource name
                useFirmware:
                  type: boolean
                  default: false
                  description: Whether to use the firmware-combined initrd (with-firmware/ subdirectory)
                template:
                  type: string
                  minLength: 1
                  description: iPXE boot template content
      additionalPrinterColumns:
        - name: BootSource
          type: string
          jsonPath: .spec.bootSourceRef
        - name: Firmware
          type: boolean
          jsonPath: .spec.useFirmware
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: boottargets
    singular: boottarget
    kind: BootTarget
    shortNames:
      - bt
