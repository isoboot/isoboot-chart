apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: boottargets.isoboot.io
spec:
  group: isoboot.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - diskImageRef
                - template
              properties:
                diskImageRef:
                  type: string
                  description: Reference to DiskImage resource
                includeFirmwarePath:
                  type: string
                  description: Path that triggers firmware merging (e.g., /initrd.gz)
                template:
                  type: string
                  description: iPXE boot template content
      additionalPrinterColumns:
        - name: DiskImage
          type: string
          jsonPath: .spec.diskImageRef
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: boottargets
    singular: boottarget
    kind: BootTarget
    shortNames:
      - bt
