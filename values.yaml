# Required: Network interface to bind to (e.g., br1, eth0)
# This value MUST be provided during install
# interface: br1

# Go commit to install for both http and controller
commit: "aa6aba2"

# HTTP server for boot files (no k8s access, talks to controller via gRPC)
http:
  port: 8080        # External port (nginx listens here, used in templates)
  listenPort: 80    # Internal port (Go server, behind nginx)
  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"

# Controller (manages provisions, talks to k8s API)
controller:
  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"

image:
  repository: alpine
  tag: "3.23"
  pullPolicy: IfNotPresent

# Squid caching proxy (for boot files, not Go modules)
proxy:
  enabled: true
  port: 3128
  maxObjectSize: "500 MB"
  cacheSize: 10000  # MB (~10GB)
  resources:
    limits:
      memory: "256Mi"
      cpu: "500m"
    requests:
      memory: "128Mi"
      cpu: "100m"

# Nginx reverse proxy (external-facing on port 8080)
nginx:
  resources:
    limits:
      memory: "128Mi"
      cpu: "200m"
    requests:
      memory: "64Mi"
      cpu: "50m"

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"
  requests:
    memory: "64Mi"
    cpu: "100m"
