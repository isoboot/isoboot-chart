# Required: Network interface to bind to (e.g., br1, eth0)
# This value MUST be provided during install
# interface: br1

# HTTP server for boot files (no k8s access, talks to controller via gRPC)
http:
  port: 8080
  commit: "a0614dd"  # Git commit to install
  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"

# Controller (manages provisions, talks to k8s API)
controller:
  commit: "a0614dd"  # Git commit to install
  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"

image:
  repository: alpine
  tag: "3.23"
  pullPolicy: IfNotPresent

# Squid caching proxy (for boot files, not Go modules)
proxy:
  enabled: true
  port: 3128
  maxObjectSize: "500 MB"
  cacheSize: 5000  # MB (~5GB)
  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "100m"

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"
  requests:
    memory: "64Mi"
    cpu: "100m"
