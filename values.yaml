# Required: Network interface to bind to (e.g., br1, eth0)
# This value MUST be provided during install
# interface: br1

# HTTP server for boot files (no k8s access, talks to controller via gRPC)
http:
  port: 8080
  commit: "595705b"  # Git commit to install
  resources:
    limits:
      memory: "2Gi"
      cpu: "1000m"
    requests:
      memory: "512Mi"
      cpu: "200m"

# Controller (manages deploys, talks to k8s API)
controller:
  commit: "595705b"  # Git commit to install
  resources:
    limits:
      memory: "2Gi"
      cpu: "1000m"
    requests:
      memory: "512Mi"
      cpu: "200m"

image:
  repository: alpine
  tag: "3.23"
  pullPolicy: IfNotPresent

# Squid caching proxy
proxy:
  enabled: true
  port: 3128
  maxObjectSize: "500 MB"
  cacheSize: 5000  # MB (~5GB)
  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "100m"

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"
  requests:
    memory: "64Mi"
    cpu: "100m"

# Boot targets
targets:
  debian-13:
    iso: "https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images/netboot/mini.iso"
    firmware: "https://cdimage.debian.org/cdimage/firmware/trixie/current/firmware.cpio.gz"
